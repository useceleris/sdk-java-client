name: Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run for the same branch or pull request cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # The whole check on every supported Java. Error Prone, NullAway and the formatter run on 21 and
  # newer. No service stack: the live suites run against a private stack.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: java -version
      - run: ./mvnw -B -ntp verify

  # Two builds from a clean tree produce byte-identical jars.
  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp -q package -DskipTests && sha256sum target/*.jar > first.sha256
      - run: ./mvnw -B -ntp -q clean package -DskipTests && sha256sum --check first.sha256
