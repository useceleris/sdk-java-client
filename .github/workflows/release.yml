name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

# A release upload must never be cancelled by a newer dispatch. The Central Portal
# deployment remains available for a maintainer to inspect and publish manually.
concurrency:
  group: java-client-release
  cancel-in-progress: false

jobs:
  release-version:
    # A production release always starts from the reviewed release branch.
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Reject snapshot versions
        shell: bash
        run: |
          version="$(./mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          case "$version" in
            *-SNAPSHOT)
              echo "Release workflow refuses snapshot version $version."
              exit 1
              ;;
          esac

  # Keep the release gated by every check that protects ordinary changes.
  check:
    if: github.ref == 'refs/heads/release'
    needs: release-version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: java -version
      - run: ./mvnw -B -ntp verify

  reproducible:
    if: github.ref == 'refs/heads/release'
    needs: release-version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp -q package -DskipTests && sha256sum target/*.jar > first.sha256
      - run: ./mvnw -B -ntp -q clean package -DskipTests && sha256sum --check first.sha256

  release:
    # A maintainer starts this workflow manually, from the release branch only.
    if: github.ref == 'refs/heads/release'
    needs: [release-version, check, reproducible]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # The release profile signs the artifacts and uploads a deployment. Its
      # autoPublish setting remains false, so publishing in Central Portal is a
      # deliberate manual approval after validation.
      - name: Build, sign, and upload to Central Portal
        run: ./mvnw -B -ntp -Prelease clean deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
